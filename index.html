<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Bulls and Cows: guess the secret 4-digit number with all different digits. A small game built with vanilla JavaScript."
    />
    <meta name="theme-color" content="#222222" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐂%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
    <title>Bulls And Cows</title>
  </head>
  <body>
    <header>
      <h1>Bulls & Cows</h1>
      <button class="btn btn__new--game">New game!</button>
      <p class="between">4 different digits!</p>
      <div class="number">?</div>
    </header>
    <main>
      <section class="section__guess">
        <input
          type="text"
          class="guess"
          inputmode="numeric"
          maxlength="4"
          autocomplete="off"
          aria-label="Your guess: 4 different digits"
        />
        <button class="btn btn__check">Check</button>
      </section>
      <section class="section_result">
        <p class="results">Results:</p>
        <p class="hint">
          Bull = right digit, right place.<br />
          Cow = right digit, wrong place.
        </p>
        <ol class="results__list"></ol>
        <p class="label__attempts">
          Attempts left: <span class="attempts">10</span>
        </p>
      </section>
      <div class="message__window hidden">
        <div class="message" role="alert">⛔️ Wrong input number!</div>
        <button class="btn__close--window" aria-label="Close message">
          Ｘ
        </button>
      </div>
    </main>
    <footer>
      <p>
        Made by Mihaela Samardzhieva ·
        <a href="https://github.com/mihaelasamardzhieva/Bulls-And-Cows"
          >GitHub</a
        >
      </p>
    </footer>
    <div class="overlay hidden"></div>
  </body>
</html>
